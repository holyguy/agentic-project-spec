<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agentic Project Template</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Agentic Project Template',
      repo: 'https://github.com/holyguy/agentic-project-template',
      loadSidebar: true,
      subMaxLevel: 3,
      basePath: '/agentic-project-template/',
      locales: {
        '/': { name: 'English', sidebar: '_sidebar.md' },
        '/zh/': { name: '简体中文', sidebar: '_sidebar.md' }
      },
      fallbackLanguages: ['/'],
      search: { placeholder: 'Search', noData: 'No results.' }
    };
  </script>
  <script src="assets/docsify.min.js"></script>
  <script src="assets/search.min.js"></script>
</body>
</html>
